<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自分へのご褒美タイプ診断 | たまごのアプリ</title>
  <meta name="description" content="10問でわかる、あなたにぴったりの“自分へのごほうび”タイプ。30秒で診断して、結果をシェアしよう。">
  <meta property="og:title" content="自分へのご褒美タイプ診断">
  <meta property="og:description" content="10問でわかる、あなたにぴったりの“自分へのごほうび”タイプ。">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">

    <!-- イントロ -->
    <section id="intro-screen" class="screen">
      <div class="card intro-card">
        <div class="intro-emoji">🎁</div>
        <h1 class="intro-title">自分へのご褒美タイプ診断</h1>
        <p class="intro-lead">毎日おつかれさま。<br>あなたにぴったりの“ごほうび”、<br>10問で見つけてみませんか？</p>
        <ul class="intro-meta">
          <li>⏱ 約30秒</li>
          <li>📝 全10問</li>
          <li>💌 結果はシェアできます</li>
        </ul>
        <button id="start-btn" class="btn btn-primary">診断をはじめる</button>
        <p class="intro-note">あてはまるものをえらぶだけ。考えすぎず直感でどうぞ🥚</p>
      </div>
    </section>

    <!-- クイズ -->
    <section id="quiz-screen" class="screen hidden">
      <div class="quiz-head">
        <div class="progress"><div id="progress-fill" class="progress-fill"></div></div>
        <p class="q-count">Q<span id="question-number">1</span> / <span id="total-questions">10</span></p>
      </div>
      <div class="card">
        <h2 id="question-text" class="question-text">　</h2>
        <div id="choices-container" class="choices"></div>
      </div>
    </section>

    <!-- 結果 -->
    <section id="result-screen" class="screen hidden">
      <div class="card result-card">
        <p class="result-label">あなたのご褒美タイプは…</p>
        <div id="result-emoji" class="result-emoji">🛋️</div>
        <h2 id="result-name" class="result-name">タイプ名</h2>
        <p id="result-catch" class="result-catch">キャッチコピー</p>
        <p id="result-comment" class="result-comment">コメント</p>
        <p id="result-tip" class="result-tip">おすすめごほうび</p>

        <div class="share">
          <button id="share-save" class="btn btn-primary">📷 結果を画像で保存</button>
          <button id="share-copy" class="btn btn-ghost">🔗 リンクをコピー</button>
        </div>
        <button id="retry-btn" class="btn btn-text">もう一度診断する</button>
      </div>

      <!-- 副CTA: 問い合わせ／リクエスト窓口 -->
      <div class="feedback">
        <p>「こんな診断・アプリほしい」のリクエスト、感想はこちらから気軽にどうぞ👇</p>
        <a href="https://tamagoojiji.github.io/tamago-tools/apps/feedback/" target="_blank" rel="noopener">リクエスト・感想を送る</a>
      </div>
    </section>

    <footer class="site-footer">
      powered by <a href="https://www.instagram.com/tamago.app" target="_blank" rel="noopener">@tamago.app</a>
    </footer>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
